# Weekly dependency updates, grouped: one PR for minor and patch updates, one for majors.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Pinned git dependencies (cadmpeg, our own repos) move by hand after testing.
    ignore:
      - dependency-name: "cadmpeg*"
      - dependency-name: "dutchman*"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
