name: Release drafts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check version and assemble notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Release tag must match the Cargo.toml version.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/changelog.py release "$version" --date "$(git show -s --format=%cs HEAD)" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 30

  # Native Linux and Windows runners, matching Dutchman's release builds.
  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:bookworm
            jobs: 2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            jobs: 4
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p dutchman-print --bin dutchman-print --target "$TARGET"
          python3 scripts/package-release.py "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dutchman-print-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Both Mac targets on one Apple silicon runner, as in Dutchman.
  macos:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dutchman-print --bin dutchman-print --target "$target"
            python3 scripts/package-release.py "$target" "$VERSION"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dutchman-print-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: [metadata, build, macos]
    # A manual branch run only builds artifacts. A tag must already exist.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dutchman-print-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Verify archives
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*)
          checksums=(*.sha256)
          [[ ${#files[@]} == 10 && ${#checksums[@]} == 5 ]]
          for checksum in "${checksums[@]}"; do
            sha256sum --check --strict "$checksum"
          done
          for file in *; do
            if [[ "$file" != *.sha256 ]]; then
              test -f "$file.sha256"
            fi
          done
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .html_url")
          if [[ -n "$existing" ]]; then
            echo 'A release already exists for this tag; remove it explicitly before retrying.' >&2
            exit 1
          fi
          gh release create "$tag" --draft --latest=false --verify-tag \
            --title "Dutchman Print $VERSION" --notes-file release-notes.md dist/*
