[workspace]
members = ["crates/dutchman-print"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/dutchman-cad/print"

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "0.4"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Never crash: hostile input must come back as an error, never as a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

