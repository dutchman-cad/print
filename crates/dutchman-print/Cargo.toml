[package]
name = "dutchman-print"
default-run = "dutchman-print"
description = "Dutchman Print: a local printer companion for SolidCraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "multipart", "query"] }
clap = { workspace = true, features = ["env"] }
dutchman-serve = { path = "../dutchman-serve" }
zip.workspace = true
http-body-util = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time", "sync", "process"] }
toml = "1.1"
thiserror.workspace = true
getrandom.workspace = true

hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
md-5 = "0.11"
sha2.workspace = true

rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
bytes = "1"
rcgen = "0.14"
tempfile.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "dutchman-fake-slicer"
path = "tests/helpers/fake-slicer.rs"
test = false
doc = false
