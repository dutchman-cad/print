[package]
name = "dutchman-print"
default-run = "dutchman-print"
description = "Dutchman Print: a local printer companion for SolidCraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "multipart", "query"] }
clap = { workspace = true, features = ["env"] }
dutchman-serve = { path = "../dutchman-serve" }
zip.workspace = true
http-body-util = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time", "sync", "process"] }
toml = "1.1"
thiserror.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "dutchman-fake-slicer"
path = "tests/helpers/fake-slicer.rs"
test = false
doc = false
